; ShipYard PHP-FPM pool overrides.
;
; Long-lived SSE responses (web terminal sessions, deployment log streams,
; database install streams) each occupy one FPM child for their whole
; lifetime. The stock php:8.2-fpm pool allows only 5 children, so a couple
; of open streams would starve the rest of the API.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Database restore uploads run to a gigabyte. PHP spools request bodies to
; disk rather than memory, so memory_limit is unaffected by these.
;
; upload_max_filesize matches the endpoint's own `max:1228800` validation rule
; exactly (1228800 KB is 1200 MiB), so the largest file the API advertises is
; the largest file PHP will accept.
;
; post_max_size must be STRICTLY larger. It bounds the whole multipart body,
; which carries target_database, overwrite, and confirm_name alongside the
; file, plus boundaries and per-part headers. Setting it equal to
; upload_max_filesize means a file at exactly the advertised maximum overflows
; the body limit, and PHP then discards the entire request rather than
; rejecting the file, so the endpoint reports a missing field instead of a file
; that is too large.
php_admin_value[upload_max_filesize] = 1200M
php_admin_value[post_max_size] = 1216M
